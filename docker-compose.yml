# 能碳智控平台 · 生产部署（自包含镜像，非开发式源码挂载）
#
# 用法（服务器，无需 python/node/npm）：
#   git clone --depth 1 <repo> /opt/carbon-platform
#   cd /opt/carbon-platform
#   cp .env.example .env           # 按需填 LLM_API_KEY
#   docker compose up -d --build
#
# 访问：http://<服务器IP>:40014    （平台，前端由后端静态托管）
#        http://<服务器IP>:40184    （文档站）
#
# 数据安全：backend/data、backend/config、backend/knowledge 以目录挂载，
#           运行期写盘内容持久化在服务器源码目录内，镜像更新不覆盖。
# 更新：git pull && docker compose up -d --build（见 deploy/update.sh）

services:
  steel-twin:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/zhibinqiu/power_simulation:latest   # 已有镜像时 docker compose pull 免构建
    container_name: steel-carbon-twin
    working_dir: /app
    volumes:
      # 运行期可变数据/配置以目录挂载持久化（不整体挂载源码，代码在镜像内）
      - ./backend/data:/app/backend/data
      - ./backend/config:/app/backend/config
      - ./backend/knowledge:/app/backend/knowledge
    ports:
      - "40014:8010"               # 主机 40014 -> 容器 8010
    environment:
      - PYTHONUNBUFFERED=1
      # Broker 连接地址：box_config.json 默认指向新云端公网 IP（本地开发直连用）；
      # 容器内通过 docker 网关回环宿主（172.18.0.1）更快更稳，故此处覆盖。
      - BROKER_HOST=172.18.0.1
      # 大模型策略拆解（OpenAI 兼容接口）。未配置时自动回退到规则解析。
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
    restart: unless-stopped

  # 独立文档网站（宣传手册/使用手册/技术文档），dist 已入库，零构建
  docs-site:
    build:
      context: .
      dockerfile: Dockerfile.docs
    image: ghcr.io/zhibinqiu/power_simulation-docs:latest
    container_name: nengtan-docs-site
    ports:
      - "40184:40183"
    restart: unless-stopped
