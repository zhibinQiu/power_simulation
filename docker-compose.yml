# 能碳智控平台 · 源码卷挂载 + uvicorn --reload（开发-生产同构，日常更新免重建）
#
# 运行方式（服务器，仅需 Docker；无需 python/node/npm/venv）：
#   cd <部署目录>
#   docker compose up -d --build          # 首次 / 依赖变更：构建运行环境镜像
#   日常更新代码（rsync backend/ 与 frontend/dist 到部署目录即可）：
#     - 后端改动：容器内 uvicorn --reload 自动生效（秒级，无需重建/重启）
#     - 前端改动：本地 npx vite build 后同步 frontend/dist（静态文件即刻生效）
#   仅当 backend/config/requirements.txt / Dockerfile / docker-compose.yml
#   变更时才需重新 docker compose up -d --build（依赖层缓存命中，通常 1 分钟内）。
#
# 数据安全：backend 整目录卷挂载（含 data/config/knowledge），运行期写盘内容
#           即宿主机目录，重建容器/升级镜像不覆盖。
# 访问：http://<服务器IP>:40014    （平台，前端由后端静态托管）
#        http://<服务器IP>:40184    （文档站）

services:
  steel-twin:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/zhibinqiu/power_simulation:latest   # 本地 build 覆盖同 tag，不依赖公网拉取
    container_name: steel-carbon-twin
    working_dir: /app
    volumes:
      # 源码卷挂载（reload 生效）+ 前端构建产物挂载（后端静态托管）
      - ./backend:/app/backend
      - ./frontend/dist:/app/frontend/dist
    ports:
      - "40014:8010"               # 主机 40014 -> 容器 8010
    environment:
      - PYTHONUNBUFFERED=1
      # Broker 连接地址：box_config.json 默认指向新云端公网 IP（本地开发直连用）；
      # 容器内通过 docker 网关回环宿主（172.18.0.1）更快更稳，故此处覆盖。
      - BROKER_HOST=172.18.0.1
      # 大模型策略拆解（OpenAI 兼容接口）。未配置时自动回退到规则解析。
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
    restart: unless-stopped

  # 独立文档网站（宣传手册/使用手册/技术文档），dist 已入库，零构建
  docs-site:
    build:
      context: .
      dockerfile: Dockerfile.docs
    image: ghcr.io/zhibinqiu/power_simulation-docs:latest
    container_name: nengtan-docs-site
    ports:
      - "40184:40183"
    restart: unless-stopped
