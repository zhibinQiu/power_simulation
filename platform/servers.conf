# ============================================================================
# 能碳平台 · 部署服务器地址集中配置（platform/servers.conf）
#
# 各部署/更新脚本（platform/deploy.sh、platform/update.sh，以及
# bs-deploy / doc-deploy / portal-deploy / nginx-deploy / cloud-deploy 下的脚本）
# 默认 source 本文件确定目标服务器与目录，脚本内不再内嵌 IP。
# 覆盖优先级：命令行参数 / 环境变量 > 本文件（本文件用 ${VAR:=默认} 写法，
# 同名变量已设置时不覆盖，故 export PLATFORM_SSH=root@<新机> 即可临时换机）。
#
# 命名约定：<机器>_SSH = 免密 SSH 入口（user@host）
#           <机器>_IP  = 对外访问 IP
#           <机器>_DIR = 服务器上的部署目录
#           <机器>_PORT = 对外端口（遵循 40000+ 端口规范）
# ============================================================================

# ---- 平台机（现网 71）：bs 平台容器 + 文档站容器（Docker compose 同机） ----
: "${PLATFORM_SSH:=root@36.151.146.71}"   # SSH 入口（开发机 rsync / git 更新目标）
: "${PLATFORM_IP:=36.151.146.71}"         # 对外 IP
: "${PLATFORM_DIR:=/root/qzb/jianpai}"    # 服务器上的仓库根目录（update.sh 同步目标）
: "${PLATFORM_PORT:=40014}"               # 平台对外端口
: "${DOCS_PORT:=40184}"                   # 文档站端口（随平台同机容器）

# ---- 云端（K3s + KubeEdge CloudCore + MQTT + TDengine + cloud-agent；现与平台同机，可分机） ----
: "${CLOUD_IP:=36.151.146.71}"            # 云端对外 IP（deploy_cloud.sh 默认；边缘盒子需能路由到）

# ---- 官网机（www.nengyousuan.com）：nginx 反代网关 + 官网静态内容 ----
: "${WEB_SSH:=root@43.161.194.75}"        # SSH 入口（nginx 配置下发 / 官网内容更新）
: "${WEB_DIR:=/var/www/nengyousuan}"      # 官网静态内容目录（portal-deploy/update.sh 目标）
: "${WEB_BACKEND:=36.151.146.71:40014}"   # nginx 反代指向的平台后端（/sim /api /docs）

# ---- 门户独立站点（可独立装到指定服务器；现默认平台机） ----
: "${PORTAL_SSH:=root@36.151.146.71}"     # SSH 入口（portal-deploy/deploy.sh 目标）
: "${PORTAL_PORT:=40200}"                 # 门户端口
