# 能碳智控平台 · 部署编排（platform/bs-deploy/ 内；build context = 仓库根 ../..）
#
# name: 固定项目名（与部署目录名解耦）。compose 默认以编排文件所在目录为项目名，
#       而本编排位于 platform/bs-deploy/（子目录），故显式固定为 jianpai，
#       以便与部署目录名变化/多副本场景下容器归属一致。
name: jianpai
#
# 源码卷挂载 + uvicorn --reload（开发-生产同构，日常更新免重建）
#
# 运行方式（服务器，仅需 Docker；无需 python/node/npm/venv）：
#   cd <仓库根>/platform/bs-deploy
#   docker compose up -d --build          # 首次 / 依赖变更：构建运行环境镜像
#   日常更新代码（git pull / rsync backend/ 与 frontend/dist 到仓库根即可）：
#     - 后端改动：容器内 uvicorn --reload 自动生效（秒级，无需重建/重启）
#     - 前端改动：本地 npx vite build 后同步 frontend/dist（静态文件即刻生效）
#   仅当 platform/bs-deploy/requirements 上游或 Dockerfile / compose 变更时
#   才需重新 docker compose up -d --build（依赖层缓存命中，通常 1 分钟内）。
#
# 说明：
#   * build.context = 仓库根（../..）：Dockerfile 内 COPY backend/config/requirements.txt
#     与仓库根 .dockerignore 均基于该 context；dockerfile 相对 context 指回本目录。
#   * 相对卷挂载（../../*）同样解析到仓库根，运行期写盘内容即宿主机源码目录，
#     重建容器/升级镜像不覆盖。
# 访问：http://<服务器IP>:40014            （平台，前端由后端静态托管）
#        http://<服务器IP>:40014/docs/     （文档站：宣传手册/使用手册/技术文档，经平台同源反代，
#                                           页面资源带 /docs/ 前缀；40184 已非必开端口）

services:
  steel-twin:
    build:
      context: ../..
      dockerfile: platform/bs-deploy/Dockerfile
    image: ghcr.io/zhibinqiu/power_simulation:latest   # 本地 build 覆盖同 tag，不依赖公网拉取
    container_name: steel-carbon-twin
    working_dir: /app
    volumes:
      # 源码卷挂载（reload 生效）+ 前端构建产物挂载（后端静态托管）
      - ../../backend:/app/backend
      - ../../frontend/dist:/app/frontend/dist
    ports:
      - "40014:8010"               # 主机 40014 -> 容器 8010
    environment:
      - PYTHONUNBUFFERED=1
      # Broker 连接地址：box_config.json 默认指向新云端公网 IP（本地开发直连用）；
      # 容器内通过 docker 网关回环宿主（172.18.0.1）更快更稳，故此处覆盖。
      - BROKER_HOST=172.18.0.1
      # 文档站反代目标：平台后端把 /docs/* 保留前缀转发到本 compose 网络的 docs-site
      # 服务（40183），对外统一走平台 40014，文档站 40184 不再要求开放（云安全组免配）。
      - DOCS_PROXY_TARGET=http://docs-site:40183
      # 大模型策略拆解（OpenAI 兼容接口）。未配置时自动回退到规则解析。
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
    restart: unless-stopped

  # 独立文档网站（宣传手册/使用手册/技术文档）
  # 站点源码与文档位于 platform/doc-deploy/（docs-site = vite 站点，docs = 源文档）
  # dist 卷挂载：platform/doc-deploy/update.sh 构建并 rsync 新 dist 后
  # docker compose restart docs-site 即生效（免重建镜像）
  # 入口：平台同源 /docs/*（steel-twin 后端反代 → http://docs-site:40183/docs/*，
  # serve_docs.py 剥 /docs 前缀落盘）。40184 端口映射保留仅供本机调试/内网，
  # 公网访问统一走平台 40014，无需为 40184 配置安全组放行。
  docs-site:
    build:
      context: ../..
      dockerfile: platform/bs-deploy/Dockerfile.docs
    image: ghcr.io/zhibinqiu/power_simulation-docs:latest
    container_name: nengtan-docs-site
    volumes:
      - ../../platform/doc-deploy/docs-site/dist:/site/dist
    ports:
      - "40184:40183"
    restart: unless-stopped
