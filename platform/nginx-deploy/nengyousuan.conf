# ============================================================================
# 线上官网 Nginx 站点配置（本仓库为权威源，勿直接在服务器上改）
#   部署位置：官网服务器 43.161.194.75 → /etc/nginx/conf.d/nengyousuan.conf
#   修改方法：改完本文件后执行同目录 ./deploy.sh 一键下发
#             （自动备份远端旧配置 + nginx -t 校验通过后 reload，失败回滚）
#
#   职责矩阵（www.nengyousuan.com，443 Certbot 托管，80→443 跳转）：
#     ├─ 门户静态站托管   root /var/www/nengyousuan
#     │      （内容由 platform/portal-deploy/update.sh 同步）
#     ├─ 平台反代 /sim/   proxy_pass http://{BACKEND}/（尾带 / 剥掉 /sim 前缀，
#     │      后端收到 /assets/* 等根路径请求直出 frontend/dist）
#     ├─ 平台反代 /api/   proxy_pass http://{BACKEND}（保留前缀 + WebSocket upgrade，
#     │      含 /api/ws/feed、/api/ws/cloud 实时推送）
#     └─ 文档站反代 /docs/ proxy_pass http://{BACKEND}（保留前缀，后端自身再反代
#           到同机 docs-site 容器 40184）
#   {BACKEND} 默认 http://36.151.146.71:40014（71 未备案不可被域名直连，
#   故由已备案门户域名反代对外；可用 ./deploy.sh -b <ip:port> 替换后下发）
# ============================================================================

server {
    server_name www.nengyousuan.com nengyousuan.com;

    root /var/www/nengyousuan;
    index index.html;

    # ===== 应用平台反代（路径前缀 /sim/ → http://36.151.146.71:40014）=====
    # 71 服务器未备案，域名不可直连，经本门户（已备案）域名转发对外入口。
    # 注意用 ^~：避免下方 .js/.css 静态缓存正则 location 抢先命中反代资源请求。
    # 前端已按 base=/sim/ 构建；proxy_pass 末尾带 / 会剥掉 /sim 前缀再转发，
    # 后端收到 /assets/* 等根路径请求，直出 frontend/dist。
    location ^~ /sim/ {
        proxy_pass http://36.151.146.71:40014/;
        proxy_http_version 1.1;
        # Host 用 $proxy_host（上游地址）而非 $host：71 为京东云服务器，京东云对
        # 「非 80/443 端口 + 域名 Host」入站请求做备案合法性拦截（illegalitydomain.jcloud.com
        # 返回 403 网页禁止访问）；域名 Host 反代必然被拦，改传上游 IP 即放行。
        # 后端不依赖请求 Host（资源相对路径 /sim/*、文档链接走 DOCS_PUBLIC_HOST 环境变量）。
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 后端 API + WebSocket：保留 /api 前缀透传（含 /api/ws/feed、/api/ws/cloud 实时推送）
    location ^~ /api/ {
        proxy_pass http://36.151.146.71:40014;
        proxy_http_version 1.1;
        # Host 改 $proxy_host（同 /sim/ 段：京东云非标端口域名 Host 备案拦截 403）
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # 文档站（应用内"帮助/宣传手册/使用手册/技术文档"为同源 /docs/*）：保留前缀转发，
    # 71 后端自身再反代到 docs-site 容器
    location ^~ /docs/ {
        proxy_pass http://36.151.146.71:40014;
        proxy_http_version 1.1;
        # Host 改 $proxy_host（同 /sim/ 段：京东云非标端口域名 Host 备案拦截 403）
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.nengyousuan.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.nengyousuan.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = nengyousuan.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.nengyousuan.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name www.nengyousuan.com nengyousuan.com;
    return 404; # managed by Certbot


}
