<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7bff"/>
      <stop offset="1" stop-color="#0643c4"/>
    </linearGradient>
    <linearGradient id="eGradV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe2ff"/>
    </linearGradient>
    <linearGradient id="cGradV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a8f"/>
      <stop offset="1" stop-color="#081a3f"/>
    </linearGradient>
  </defs>
  <!-- 蓝色圆角底 -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <!-- 上层：浅色 E（Energy） -->
  <g fill="url(#eGradV)">
    <rect x="189" y="88"  width="27"  height="152" rx="11"/>
    <rect x="189" y="88"  width="136" height="27"  rx="11"/>
    <rect x="189" y="150" width="104" height="27"  rx="11"/>
    <rect x="189" y="213" width="136" height="27"  rx="11"/>
  </g>
  <!-- 下层：深色 C（Carbon），开口朝右 -->
  <path d="M 315 404 A 80 80 0 1 1 315 300"
        fill="none" stroke="url(#cGradV)" stroke-width="46" stroke-linecap="round"/>
</svg>
