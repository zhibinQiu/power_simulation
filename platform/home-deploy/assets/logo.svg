<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a8f"/>
      <stop offset="1" stop-color="#081a3f"/>
    </linearGradient>
    <linearGradient id="eGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe2ff"/>
      <stop offset="1" stop-color="#8fb8ff"/>
