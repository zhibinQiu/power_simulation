  <!-- 内层：浅色 E（Energy） -->
  <g fill="url(#eGrad)">
    <rect x="37" y="29" width="9"  height="42" rx="3.5"/>
    <rect x="37" y="29" width="27" height="9"  rx="3.5"/>
    <rect x="37" y="45.5" width="20" height="9" rx="3.5"/>
    <rect x="37" y="62" width="27" height="9"  rx="3.5"/>
  </g>
