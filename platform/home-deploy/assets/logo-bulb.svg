<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7bff"/>
      <stop offset="1" stop-color="#0643c4"/>
    </linearGradient>
    <linearGradient id="eGradB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe2ff"/>
    </linearGradient>
    <linearGradient id="cGradB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a8f"/>
      <stop offset="1" stop-color="#081a3f"/>
    </linearGradient>
  </defs>
  <!-- 蓝色圆角底 -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <!-- 上层：E 顺时针旋转 90°（灯头：横梁 + 三个向下的齿，尺寸略缩小） -->
  <g fill="url(#eGradB)">
    <rect x="198" y="84" width="116" height="26" rx="11"/>
    <rect x="198" y="84" width="26"  height="128" rx="11"/>
    <rect x="243" y="84" width="26"  height="104" rx="11"/>
    <rect x="288" y="84" width="26"  height="128" rx="11"/>
  </g>
  <!-- 下层：C 逆时针旋转 90°（灯罩：开口朝上的 U 形圆弧） -->
  <path d="M 204.3 251.8 A 84 84 0 1 0 307.7 251.8"
        fill="none" stroke="url(#cGradB)" stroke-width="46" stroke-linecap="round"/>
</svg>
