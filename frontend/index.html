<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>工业能碳智控平台</title>
    <script>
      /* 首屏底色：与 src/theme/index.js 默认值（白天）保持一致，仅用户显式选过夜间模式才预置深色，
         避免主包下载期间白屏/黑屏闪烁。Vue 挂载 #app 后由应用样式接管。 */
      try { if (localStorage.getItem('carbon-sim.theme-mode') === 'dark') document.documentElement.classList.add('boot-dark') } catch (e) {}
    </script>
    <style>
      html, body { margin: 0; background: #EDF1F6; }
      html.boot-dark body { background: #1B1C1E; }
      #app { height: 100%; }
    </style>
    <!-- 不再引用 Google Fonts（fonts.googleapis.com / fonts.gstatic.com）：
         国内网络环境下这两个域名基本不可达，DNS + TCP + TLS 会白白挂起数秒才超时，
         期间浏览器标签一直转圈，首屏体感「卡死」。字体改由本机字体栈提供
         （见 styles/main.css 的 --ui / --head 变量，Montserrat / Source Sans Pro 若系统已
         安装则自动命中，否则回退 PingFang SC / Microsoft YaHei），零网络请求、零加载抖动。 -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
