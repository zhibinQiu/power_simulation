<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>工业能碳智控平台</title>
    <script>
      /* 首屏占位主题：与 src/theme/index.js 默认值（深色）保持一致，避免深色用户启动闪白 */
      try { if (localStorage.getItem('carbon-sim.theme-mode') !== 'light') document.documentElement.classList.add('boot-dark') } catch (e) {}
    </script>
    <style>
      /* 首屏占位：主包下载 + 解析期间先给出可见反馈，避免长时间纯白屏。
         内联是为了零额外请求；Vue 挂载 #app 时会自动替换掉这段内容。 */
      html, body { margin: 0; background: #EDF1F6; }
      #app { height: 100%; }
      .boot { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        font-family: "Source Sans Pro", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: #47536B; }
      .boot-logo { font-size: 15px; font-weight: 600; letter-spacing: 2px; }
      .boot-bar { width: 180px; height: 2px; background: #D7DEE8; overflow: hidden; border-radius: 2px; }
      .boot-bar i { display: block; width: 40%; height: 100%; background: #E8B33A; animation: boot-slide 1.1s ease-in-out infinite; }
      .boot-tip { font-size: 12px; color: #8A93A6; }
      html.boot-dark body { background: #1B1C1E; }
      html.boot-dark .boot { color: #9A9DA3; }
      html.boot-dark .boot-bar { background: #3A3B3F; }
      html.boot-dark .boot-bar i { background: #5B8DEF; }
      html.boot-dark .boot-tip { color: #6E7178; }
      @keyframes boot-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    </style>
    <!-- 不再引用 Google Fonts（fonts.googleapis.com / fonts.gstatic.com）：
         国内网络环境下这两个域名基本不可达，DNS + TCP + TLS 会白白挂起数秒才超时，
         期间浏览器标签一直转圈，首屏体感「卡死」。字体改由本机字体栈提供
         （见 styles/main.css 的 --ui / --head 变量，Montserrat / Source Sans Pro 若系统已
         安装则自动命中，否则回退 PingFang SC / Microsoft YaHei），零网络请求、零加载抖动。 -->
  </head>
  <body>
    <div id="app">
      <div class="boot">
        <div class="boot-logo">工业能碳智控平台</div>
        <div class="boot-bar"><i></i></div>
        <div class="boot-tip">正在加载…</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
