# ============================================================
# 镜像自动构建发布（GitHub Container Registry）
#
# 部署模式：源码卷挂载 + uvicorn --reload（71 主服务器直接从仓库 build）。
# 本流水线保留为「镜像发布通道」：产物供不便 git clone 的服务器拉取运行环境
# 镜像后，再以卷挂载 backend/ 与 frontend/dist 运行（编排见
# platform/bs-deploy/docker-compose.yml）。
#
# 触发方式：
#   1) 推送 tag（v1.2.3）：构建并推送 ...:latest + :1.2.3
#   2) 推送 master：构建并推送 ...:latest
#   3) 手动 workflow_dispatch
#
# 产物：
#   ghcr.io/zhibinqiu/power_simulation:latest      平台运行环境镜像（仅 Python 依赖，
#                                                   不含业务代码与前端产物；均走源码卷挂载/rsync）
#   ghcr.io/zhibinqiu/power_simulation-docs:latest 文档站服务镜像（仅 serve 器，不含 dist；
#                                                   运行须卷挂载宿主机 dist，模式同平台镜像）
#
# 前提：仓库为 public（ghcr 公开包可匿名拉取），仓库 Settings→Actions→
#       General 勾选 Read and write permissions。
# ============================================================
name: 平台镜像发布

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  build-push:
    name: 构建并推送平台 + 文档站镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 提取版本号
        id: ver
        run: |
          VER="latest"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "tag=$VER" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runner 默认 docker driver 不支持 gha 缓存导出（Cache export is not supported
      # for the docker driver），必须显式创建 docker-container driver（默认即此）。
      - name: 设置 Buildx（docker-container driver）
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送平台运行环境镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/bs-deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:latest
            ${{ env.IMAGE_BASE }}:${{ steps.ver.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建并推送文档站镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/bs-deploy/Dockerfile.docs
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-docs:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
