# ============================================================
# 桌面端自动打包流水线（GitHub Actions）
#
# 触发方式：仅推送 tag（如 v1.0.0）时触发，普通 push 不构建。
# 流程：打包 Windows x64 安装程序 -> 自动发布 GitHub Release。
#
# 用法：
#   git tag v1.0.0 && git push github v1.0.0
#   或在仓库根目录执行：bash platform/bs-deploy/push.sh "fix: xxx" --tag v1.0.0
#
# 说明：
#   - 复用 platform/windows-deploy/build_windows.bat（内含前端构建 + PyInstaller）。
#   - 产物未签名：Windows 首次运行有 SmartScreen 提示。
# ============================================================
name: 桌面端自动打包

on:
  push:
    tags:
      - 'v*'                    # 仅 tag 触发（v1.0.0 / v1.1.0 ...）

permissions:
  contents: write

jobs:
  build-release:
    name: Windows x64 打包并发布 Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: 安装 Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # ---- 提取版本号：tag 去 v 前缀，如 v1.2.3 -> 1.2.3 ----
      - name: 提取版本号
        id: version
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "⚠️ tag 格式应为 v1.2.3，当前: $GITHUB_REF_NAME，使用默认 1.0.0"
            VER="1.0.0"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "当前版本: $VER"

      - name: 执行打包脚本 (Windows)
        shell: cmd
        run: call platform\windows-deploy\build_windows.bat

      # ---- 把 onedir 目录打成安装程序 exe（Inno Setup）----
      - name: 生成 Windows 安装程序 (Inno Setup)
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          choco install innosetup -y
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe 未找到，Inno Setup 安装失败" }
          & $iscc.FullName /DAppVersion=$env:APP_VERSION platform\windows-deploy\steelcarbon_twin.iss

      # ---- 发布 GitHub Release，附件为纯 exe（免 zip 包裹）----
      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: SteelCarbonTwin-windows-x64-setup.exe
          overwrite: true
          generate_release_notes: true
