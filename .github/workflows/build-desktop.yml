# ============================================================
# 桌面端自动打包流水线（GitHub Actions）
# 每次 push 代码到 master/main 自动并行构建：
#   - Windows x64             -> SteelCarbonTwin-windows-x64-setup.exe（Inno Setup 安装程序）
#   - macOS Apple Silicon     -> SteelCarbonTwin-macos-arm64.dmg（arm64 安装镜像）
# 打 tag（如 v1.0.0）时，额外自动发布 GitHub Release 并附带这两个安装包。
#
# 说明：
#   - 复用 platform/build_mac.sh 与 platform/build_windows.bat（内含前端构建 + PyInstaller）。
#   - 产物未签名/未公证：Windows 首次运行有 SmartScreen 提示，macOS 需右键 -> 打开。
# ============================================================
name: 桌面端自动打包

on:
  workflow_dispatch:            # 手动触发
  push:
    branches: [master, main]    # 每次 push 代码自动打包
    tags:
      - 'v*'                    # 打 tag 时自动打包并发布 Release

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # 一个平台失败不阻塞另一个
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            artifact_name: SteelCarbonTwin-windows-x64
            install_file: SteelCarbonTwin-windows-x64-setup.exe
          - name: macOS (Apple Silicon arm64)
            os: macos-15-arm64
            artifact_name: SteelCarbonTwin-macos-arm64
            install_file: SteelCarbonTwin-macos-arm64.dmg

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---- 提取版本号：tag 取 v 后面数字，无 tag 默认 1.0.0 ----
      - name: 提取版本号
        id: version
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then VER="1.0.0"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "当前版本: $VER"

      # ---- 执行各自的打包脚本（脚本内含前端构建 + PyInstaller）----
      - name: 执行打包脚本 (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call platform\build_windows.bat

      - name: 执行打包脚本 (macOS)
        if: runner.os == 'macOS'
        run: bash platform/build_mac.sh app

      # ---- 把 Windows onedir 目录打成安装程序 exe（Inno Setup）----
      - name: 生成 Windows 安装程序 (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          choco install innosetup -y
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe 未找到，Inno Setup 安装失败" }
          & $iscc.FullName /DAppVersion=$env:APP_VERSION platform\steelcarbon_twin.iss

      # ---- 把 macOS .app 打成 dmg 镜像（内含 /Applications 拖拽安装）----
      - name: 生成 macOS DMG 安装镜像
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg-root
          cp -R "dist/SteelCarbonTwin.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "SteelCarbonTwin" -srcfolder dmg-root -ov -format UDZO "${{ matrix.install_file }}"

      # ---- 上传安装包（Actions 页面可直接下载）----
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.install_file }}
          if-no-files-found: error

  # ---- 打 tag 时：收集两个平台的安装包，发布 GitHub Release ----
  release:
    name: 发布 GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 创建 Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          overwrite: true
          generate_release_notes: true
