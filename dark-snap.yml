            - heading "二、它能做什么：八大能力" [level=2] [ref=e164]
            - heading "1. 看得见 —— 把整座工厂\"搬\"进电脑" [level=3] [ref=e165]
            - list [ref=e166]:
              - listitem [ref=e167]: 钢铁的烧结、焦化、高炉、转炉、连铸、轧钢，水泥的生料磨、回转窑、粉磨站，化工的反应、精制装置……20 多种工序设备按真实比例呈现在三维场景中，整条产线尽收眼底；
              - listitem [ref=e168]: 想看哪道工序点哪里，物料怎么流动、能耗高低分布，用颜色就能看得清清楚楚；
            - blockquote [ref=e169]:
              - text: 不用进现场，也能随时掌握全厂的
              - strong [ref=e170]: 能源消耗与碳排状况
              - text: 。
            - heading "2. 建得真 —— 工艺流程自己搭，设备信息自己配" [level=3] [ref=e171]
            - paragraph [ref=e172]: 平台不仅预置了标准产线，更把"定义工厂"的能力交到企业自己手中：
            - list [ref=e173]:
              - listitem [ref=e174]:
                - strong [ref=e175]: 工艺流程自己搭
                - text: ：像搭积木一样，拖一拖、连一连，就能搭出企业真实的工艺流程——钢铁的原料、炼铁、炼钢到轧钢，水泥的生料、熟料到粉磨，流程怎么走，企业说了算；
              - listitem [ref=e176]:
                - strong [ref=e177]: 设备信息自己配
                - text: ：每台设备的量程、运行范围、规模大小都可以按企业实际"量身定制"；
              - listitem [ref=e178]:
                - strong [ref=e179]: 改完马上生效
                - text: ：流程搭好、设备配好，三维场景和仿真结果随即更新；
              - listitem [ref=e180]:
                - strong [ref=e181]: 上手无门槛
                - text: ：内置行业模板一键载入，在模板基础上自由修改即可。
            - blockquote [ref=e182]:
              - text: 平台不替您决定工艺，而是把"定义工艺的能力"交给您——
              - strong [ref=e183]: 一厂一策，千厂千面。
            - heading "3. 算得清 —— 全厂一本\"能源账 + 碳账 + 成本账\"" [level=3] [ref=e184]
            - list [ref=e185]:
              - listitem [ref=e186]:
                - strong [ref=e187]: 能源账
                - text: ：从原料到成品，每道工序的电、气、煤、焦消耗自动汇总，全厂能耗一目了然，吨钢、吨熟料等单耗随手可查；
              - listitem [ref=e188]:
                - strong [ref=e189]: 碳账
                - text: ：每道工序的碳排放自动核算，全厂碳排总量、单位产品碳强度（吨钢、吨熟料等）一键可得；
              - listitem [ref=e190]:
                - strong [ref=e191]: 成本账
                - text: ：每次调整都同步估算成本变化——燃料、电力、物料省了多少，清清楚楚；
              - listitem [ref=e192]:
                - strong [ref=e193]: 账目可追溯
                - text: ：每一笔能源、每一笔碳从哪来、到哪去，清清楚楚，经得起核查。
            - blockquote [ref=e194]:
              - text: 能、碳、钱三本账一起算——
              - strong [ref=e195]: 能耗看得见、碳排算得明、成本省得着。
