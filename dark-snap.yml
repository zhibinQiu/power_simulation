            - heading "工业能碳智控平台 · 系统介绍（v2.0.0）" [level=1] [ref=e114]
            - blockquote [ref=e115]:
              - strong [ref=e116]: 给每座工厂派驻一位"工业级具身智能体"
              - text: 它看得见现场、
              - strong [ref=e117]: 懂能、懂碳、懂市场
              - text: ——算得清能源账、碳账与成本账，想得出方案、动得了参数、写得好报告，24 小时在岗，为企业的节能降碳保驾护航。
            - heading "一、核心理念：一位懂能、懂碳、懂市场的\"数字专家\"" [level=2] [ref=e118]
            - heading "1. 工业级具身智能 —— 不只是\"会聊天\"的 AI" [level=3] [ref=e119]
            - paragraph [ref=e120]:
              - text: 人工智能正在发生深刻变革：AI 不再只是"会聊天、能对话"的软件，而是进化出了
              - strong [ref=e121]: 感知、认知、决策、行动
              - text: 的完整能力——它看得见、想得到、更做得出，这就是前沿的"具身智能"。
            - paragraph [ref=e122]:
              - strong [ref=e123]: 工业级具身智能，就是把这样的智能体派驻到您的工厂。
              - text: 过去，节能减排靠老师傅的经验、靠外请专家诊断、靠反复试验摸索；现在，平台将工厂"全要素数字化"后，AI 智能体便有了一个可以持续感知和行动的"身体"，成为工厂里"24 小时在岗的数字专家"。
            - paragraph [ref=e124]:
              - text: 这位数字专家与众不同之处在于——它
              - strong [ref=e125]: 不是只盯着碳
              - text: ，而是同时长着三双眼睛：
            - table [ref=e126]:
              - rowgroup [ref=e127]:
                - row [ref=e128]:
                  - columnheader "洞察维度" [ref=e129]
                  - columnheader "关注什么" [ref=e130]
                  - columnheader "行业场景（以钢铁为例）" [ref=e131]
              - rowgroup [ref=e132]:
                - row [ref=e133]:
                  - cell [ref=e134]:
                    - strong [ref=e135]: 懂能
                  - cell "能源消耗、能效水平" [ref=e136]
                  - cell "每吨产品烧了多少电、多少煤气、多少燃料（吨钢、吨熟料……），能效哪里还有空间" [ref=e137]
                - row [ref=e138]:
                  - cell [ref=e139]:
                    - strong [ref=e140]: 懂碳
                  - cell "碳排放、碳强度" [ref=e141]
                  - cell "每道工序排了多少碳，全厂一本明白账，控排履约有底气" [ref=e142]
                - row [ref=e143]:
                  - cell [ref=e144]:
                    - strong [ref=e145]: 懂市场
                  - cell "碳价、原料价、行业资讯" [ref=e146]
                  - cell "碳配额什么价、焦煤什么价、政策有什么新动向，决策有依据" [ref=e147]
            - heading "2. 云边协同 —— \"就近感知、云端思考\"的分工合作" [level=3] [ref=e148]
            - paragraph [ref=e149]:
              - text: 要让数字专家足够聪明、反应足够快，平台采用了一套聪明的分工方式——
              - strong [ref=e150]: 云边协同
              - text: ：
            - list [ref=e151]:
              - listitem [ref=e152]:
                - strong [ref=e153]: 厂里放一个"耳朵"（能碳一体机）
                - text: ：部署在工厂现场，就近收集能源、生产、计量各类数据，随采随算，网络波动也不影响数据采集；
              - listitem [ref=e154]:
                - strong [ref=e155]: 云端有一颗"大脑"（平台系统）
                - text: ：汇聚全厂数据，负责深度的核算、推演、学习与思考，越用越聪明；
              - listitem [ref=e156]:
                - strong [ref=e157]: 两边默契配合
                - text: ：现场数据源源不断传上云端，云端智慧随时下发指导，一台数字专家、两处协同工作。
            - blockquote [ref=e158]:
              - text: 简单说：
              - strong [ref=e159]: 现场的事，就近办；深度的事，云端想——反应快，还不丢数据，两全其美。
