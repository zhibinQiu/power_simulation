            - heading "两大接入方式，真正\"开箱即用\"" [level=3] [ref=e294]
            - paragraph [ref=e295]:
              - strong [ref=e296]: 1. 不打扰、不改造——轻轻接入企业现有系统
            - list [ref=e297]:
              - listitem [ref=e298]: 无需改造企业现有系统，不触碰生产网络，像"旁路"一样顺路采集能源与碳排数据；
