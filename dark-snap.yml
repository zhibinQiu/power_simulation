                - text: ：输入一句话，AI 自动完成"解析 → 确认 → 应用 → 对比"全流程，让"您说、它调、您验"成为现实。
            - blockquote [ref=e232]: AI 不只给建议，还能动手干，节能减碳闭环真正跑起来。
